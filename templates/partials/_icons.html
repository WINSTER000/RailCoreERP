{% comment %}
Inline SVG icon sprite for RailCore ERP.

Included once near the top of <body> in base.html / base_public.html so that
icons work without any external network request. Reference an icon with the
rc_tags helper:  {% load rc_tags %} ... {% rc_icon "train" %}
which renders <svg class="rc-icon"><use href="#icon-train"></use></svg>.
{% endcomment %}
